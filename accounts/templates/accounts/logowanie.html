<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Logowanie - GymApp</title>
</head>
<body>
    <h1>Zaloguj się</h1>

    <form method="post">
        {% csrf_token %}
        {{ formularz.as_p }}
        <button type="submit">Zaloguj się</button>
    </form>

    <p>Nie masz konta? <a href="{% url 'rejestracja' %}">Zarejestruj się</a></p>
</body>
</html>
