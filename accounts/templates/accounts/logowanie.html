{% extends 'base.html' %}

{% block tytul %}Logowanie - GymApp{% endblock %}

{% block zawartosc %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-5">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Zaloguj się</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ formularz.as_p }}
                    <button type="submit" class="btn btn-dark w-100 mt-2">Zaloguj się</button>
                </form>
                <p class="mt-3 text-center">Nie masz konta? <a href="{% url 'rejestracja' %}">Zarejestruj się</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
