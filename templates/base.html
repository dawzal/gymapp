<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block tytul %}GymApp{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">💪 GymApp</a>
        <div class="navbar-nav ms-auto">
            {% if request.user.is_authenticated %}
                <span class="navbar-text text-light me-3">Cześć, {{ request.user.username }}!</span>
                <a class="nav-link" href="{% url 'wylogowanie' %}">Wyloguj</a>
            {% else %}
                <a class="nav-link" href="{% url 'logowanie' %}">Zaloguj</a>
                <a class="nav-link" href="{% url 'rejestracja' %}">Rejestracja</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block zawartosc %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
