{% extends 'base.html' %}

{% block tytul %}{{ tytul }} - GymApp{% endblock %}

{% block zawartosc %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">{{ tytul }}</h4>
                {% if podtytul %}<small>{{ podtytul }}</small>{% endif %}
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% include 'pola_formularza.html' %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark">{{ przycisk }}</button>
                        {% if przycisk_kolejny %}
                        <button type="submit" name="dodaj_kolejne" value="1" class="btn btn-outline-dark">{{ przycisk_kolejny }}</button>
                        {% endif %}
                        <a href="{{ anuluj }}" class="btn btn-outline-secondary">Anuluj</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
