{% extends 'base.html' %}

{% block tytul %}{{ tytul }} - GymApp{% endblock %}

{% block zawartosc %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Potwierdź usunięcie</h4>
            </div>
            <div class="card-body">
                <p>{{ opis }}</p>
                <p class="text-danger">{{ ostrzezenie }}</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Tak, usuń</button>
                        <a href="{{ anuluj }}" class="btn btn-outline-secondary">Anuluj</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
